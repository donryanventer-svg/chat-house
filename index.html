    <script>
      (function() {
        // 1. Intercept Vite HMR WebSocket connection attempts in container preview sandbox
        if (typeof window !== 'undefined' && 'WebSocket' in window) {
          const OriginalWebSocket = window.WebSocket;
          window.WebSocket = new Proxy(OriginalWebSocket, {
            construct(target, args) {
              const [url, protocols] = args;
              const isViteHmr =
                protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                (typeof url === 'string' && (url.includes('token=') || url.includes('24678')));

              if (isViteHmr) {
                const mock = new EventTarget();
                mock.readyState = 1; // WebSocket.OPEN
                mock.OPEN = 1;
                mock.CLOSED = 3;
                mock.CLOSING = 2;
                mock.CONNECTING = 0;
                mock.binaryType = 'blob';
                mock.bufferedAmount = 0;
                mock.extensions = '';
                mock.protocol = 'vite-hmr';
                mock.url = url || '';
                mock.send = function() {};
                mock.close = function() {
                  mock.readyState = 3;
                  mock.dispatchEvent(new Event('close'));
                };
                // Dispatch open event on next microtask
                Promise.resolve().then(() => {
                  mock.dispatchEvent(new Event('open'));
                });
                return mock;
              }
              return Reflect.construct(target, args);
            }
          });
        }

        // 2. Filter benign vite connection warnings from console
        const origError = console.error;
        console.error = function(...args) {
          if (
            args.length > 0 &&
            (
              (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket connection to'))) ||
              (args[0] && typeof args[0] === 'object' && args[0].message && args[0].message.includes('WebSocket'))
            )
          ) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (
            args.length > 0 &&
            typeof args[0] === 'string' &&
            (args[0].includes('[vite]') || args[0].includes('WebSocket connection to'))
          ) {
            return;
          }
          origWarn.apply(console, args);
        };

        // 3. Catch unhandled rejection for websocket closes
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket closed without opened')) {
            event.preventDefault();
          }
        });
      })();
    </script>
